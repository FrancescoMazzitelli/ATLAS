ollama:
  model: "gemma4:e4b"
  temperature: 0.7
  top_p: 0.9
  num_predict: 8192
  timeout_seconds: 60  # timeout for each LLM call
  max_retries: 1  # retries on timeout or error

agents:
  n_sample: 10000
  demographic_inclusion: "narrative"  # "narrative" | "footer" | "both"
  demographic_inclusion_percent: 0.8  # if "narrative" or "both": percentage of demographics to weave into narrative text
  demographic_inclusion_in_intros_diaries: "narrative"  # "none" | "narrative" | "footer" | "both" - whether to include demographic context when generating intros and diaries
  checkpoint_frequency: 20  # cache/checkpoint combined agents.json every N agents (0 to disable)

synth:
  source: "US"
  sim_year: 2019
  system_message_header: ""
  system_message_footer: ""

data:
  base_path: "./synth_data"
  mydailytravel_source_path: "./mydailytravel/source"

survey:
  min_age: 18
  max_age: 65

mood:
  neutral: 1.0
