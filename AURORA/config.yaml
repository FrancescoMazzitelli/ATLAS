# AURORA — Autonomous Urban Reasoning and Optimized Routing Adaptation
# All simulation parameters in one place. No code changes needed.

# ─── Routing Engine (Valhalla) ─────────────────────────────────────
valhalla:
  host: "137.121.163.115"
  port: 8002
  timeout: 60

# ─── Language Model ─────────────────────────────────────────────────
llm:
  provider: "ollama"
  model: "qwen3.6:35b"
  temperature: 0.5
  base_url: "http://localhost:11434"
  num_predict: 4096

# ─── Nominatim Geocoding (optional container) ───────────────────────
nominatim:
  host: "137.121.163.115"
  port: 8083
  timeout: 60

# ─── Data Source ────────────────────────────────────────────────────
data:
  agents_file: "data/agents.jsonl"
  locations: ""
  num_agents: 50

# ─── Simulation ─────────────────────────────────────────────────────
simulation:
  seed: 42
  log_level: "INFO"
  recursion_limit: 100
  disruption_files:
    - "data/disruptions.json"
  clock:
    start_datetime: "2019-07-17T07:00:00"
    tick_duration_minutes: 5
    tick_duration_seconds: 1
    max_ticks: 86400

# ─── Discretionary Activities ──────────────────────────────────────
discretionary:
  enabled: true
  social_invitation: "A colleague from work invites you to grab a beer after work. You had planned to {context}. What do you do?"
  accept_probability: 0.5

# ─── Path Decomposition ─────────────────────────────────────────────
path:
  step_km: 1.0

# ─── Traffic ─────────────────────────────────────────────────────────
traffic:
  csv_dir: "traffic"
  jam_density_per_km: 50.0
  docker_container: ""
  valhalla_config: "/etc/valhalla/valhalla.json"
  container_traffic_dir: "/traffic"
  traffic_backup_dir: "traffic_backup"

# ─── Output ──────────────────────────────────────────────────────────
output:
  dir: "output"
  generate_map: true
  map_zoom: 12
  center_lat: 41.8781
  center_lon: -87.6298
